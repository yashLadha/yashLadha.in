<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Lambda Performance Comparison: Go vs Java</title>
  <desc id="desc">A cold start trace at 128 MB. The Go function finishes its INIT phase in 140 ms, while the Java function takes 1651 ms, so Go is ready about 1.5 seconds sooner.</desc>
  <defs>
    <style>
      .sans { font-family: "Commissioner Variable", "Commissioner", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Source Code Pro Variable", "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .tick { font-size: 14px; fill: #6e7681; }
      .lane { font-size: 15px; fill: #8b949e; }
    </style>
    <pattern id="ms" width="28.89" height="630" patternUnits="userSpaceOnUse" x="80">
      <line x1="0.5" x2="0.5" y1="0" y2="630" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
    <linearGradient id="java" x1="0" x2="1">
      <stop offset="0" stop-color="#e76f00"/>
      <stop offset="1" stop-color="#f59e3b"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#0f1317"/>
  <rect x="80" width="1040" height="630" fill="url(#ms)"/>
  <text x="1150" y="380" text-anchor="end" class="sans" font-size="420" font-weight="800" fill="#ffffff" fill-opacity="0.04">λ</text>

  <g class="sans">
    <text x="80" y="92" class="mono" font-size="16" fill="#8b949e" letter-spacing="2">AWS LAMBDA · COLD START TRACE</text>
    <text x="78" y="162" font-size="62" font-weight="800" fill="#f5f3ef">Go vs Java on Lambda</text>
    <text x="80" y="206" font-size="23" fill="#8b949e">How long INIT takes before the first request is served</text>
  </g>

  <g stroke="#ffffff" stroke-opacity="0.18" stroke-width="1.5" stroke-dasharray="3 5">
    <line x1="161" x2="161" y1="300" y2="540"/>
    <line x1="1034" x2="1034" y1="300" y2="540"/>
  </g>
  <path d="M161 308 V296 H1034 V308" fill="none" stroke="#f5f3ef" stroke-width="2"/>
  <text x="597" y="282" text-anchor="middle" class="sans" font-size="21" font-weight="700" fill="#f5f3ef">Go is ready ~1.5 s sooner</text>

  <text x="80" y="370" class="mono lane">go · 128 MB</text>
  <rect x="80" y="380" width="81" height="38" rx="5" fill="#00add8"/>
  <text x="174" y="405" class="mono" font-size="16" fill="#5fd4ee">140 ms</text>
  <line x1="246" x2="1120" y1="399" y2="399" stroke="#00add8" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="1 7" stroke-linecap="round"/>

  <text x="80" y="456" class="mono lane">java · 128 MB</text>
  <rect x="80" y="466" width="954" height="38" rx="5" fill="url(#java)"/>
  <text x="96" y="491" class="mono" font-size="15" font-weight="700" fill="#2a1600">INIT</text>
  <text x="1046" y="491" class="mono" font-size="16" fill="#f59e3b">1651 ms</text>

  <line x1="80" x2="1120" y1="540" y2="540" stroke="#30363d" stroke-width="1.5"/>
  <g class="mono tick" text-anchor="middle">
    <text x="80" y="564">0</text>
    <text x="369" y="564">500 ms</text>
    <text x="658" y="564">1000 ms</text>
    <text x="947" y="564">1500 ms</text>
  </g>

  <text x="80" y="604" class="mono" font-size="13" fill="#6e7681">average INIT duration · arm64 · ~1,500 invocations per config</text>
</svg>
