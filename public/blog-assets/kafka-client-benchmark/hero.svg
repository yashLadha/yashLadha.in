    <text x="574.0" y="218.9" text-anchor="middle" class="sans halo" font-size="18" font-weight="600" fill="#4a463f">1.04M msg/s</text>
    <circle cx="1030.0" cy="249.2" r="13" fill="none" stroke="#1f3a4d" stroke-width="2.5"/>
    <text x="1044.0" y="203.2" text-anchor="end" class="sans halo" font-size="21" font-weight="700" fill="#1f3a4d">Rust peak: 1 MB</text>
    <text x="1044.0" y="226.2" text-anchor="end" class="sans halo" font-size="18" font-weight="600" fill="#4a463f">1.01M msg/s</text>
    <text x="1052.0" y="257.2" class="sans halo" font-size="23" font-weight="700" fill="#1f3a4d">Rust</text>
    <text x="1052.0" y="350.9" class="sans halo" font-size="23" font-weight="700" fill="#e76f00">Java</text>
