<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Java vs Rust Kafka clients: chasing down a 16x gap, one default at a time, on both clients</title>
  <desc id="desc">Producer throughput of the Java Kafka client and rust-rdkafka as batch.size grows from 16 KB to 1 MB. Java peaks at 128 KB with 1.04M msg/s and Rust at 1 MB with 1.01M msg/s: each client peaks at a different batch.size.</desc>
  <defs>
    <style>
      .sans { font-family: "Geist", system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .mono { font-family: "Source Code Pro", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .axis { font-size: 18px; font-weight: 500; fill: #4a463f; }
      .halo { paint-order: stroke; stroke: #faf9f6; stroke-width: 7px; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="#faf9f6"/>

  <g class="sans">
    <text x="56" y="80" font-size="58" font-weight="800" fill="#1c1a17"><tspan fill="#e76f00">Java</tspan> vs <tspan fill="#1f3a4d">Rust</tspan> Kafka clients</text>
    <text x="58" y="122" font-size="25" fill="#6b665f">Chasing down a 16x gap, one default at a time, on both clients</text>
    <text x="110" y="172" font-size="22" font-weight="700" fill="#1c1a17">Each client peaks at a different batch.size</text>
  </g>

