    <text x="102" y="382.0" text-anchor="end" class="sans axis">500k</text>
    <line x1="110" x2="1042" y1="314.0" y2="314.0" stroke="#e4e0d8" stroke-width="1.5"/>
    <text x="102" y="320.0" text-anchor="end" class="sans axis">750k</text>
    <line x1="110" x2="1042" y1="252.0" y2="252.0" stroke="#e4e0d8" stroke-width="1.5"/>
    <text x="102" y="258.0" text-anchor="end" class="sans axis">1M</text>
